<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sorry Sappuuuuuuuuu ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#070207;color:#fff;font-family:"Poppins",sans-serif}
.scene{
  position:relative;width:100vw;height:100vh;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 50% 45%,rgba(255,40,120,.16),transparent 22%),
    radial-gradient(circle at 50% 100%,rgba(255,0,100,.14),transparent 45%),
    linear-gradient(160deg,#050106,#12030e,#080208)
}
#particles{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.center{position:relative;z-index:5;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.top-text{
  position:absolute;top:6%;left:50%;transform:translateX(-50%);
  font-size:10px;letter-spacing:.35em;color:rgba(255,190,220,.55);
  white-space:nowrap;opacity:0;animation:topAppear 1.5s ease forwards
}
@keyframes topAppear{from{opacity:0;transform:translate(-50%,-15px)}to{opacity:1;transform:translate(-50%,0)}}
.sorry{
  position:relative;z-index:6;font-family:"Playfair Display",serif;
  font-size:clamp(48px,14vw,120px);font-weight:800;letter-spacing:.18em;opacity:0;
  text-shadow:0 0 8px rgba(255,120,180,.9),0 0 25px rgba(255,20,100,.7),0 0 70px rgba(255,0,100,.4)
}
.name{
  position:relative;z-index:7;display:flex;align-items:baseline;justify-content:center;
  margin-top:8px;font-family:"Dancing Script",cursive;font-weight:700;
  font-size:clamp(42px,11vw,95px);line-height:1;white-space:nowrap;color:#fff;
  filter:drop-shadow(0 0 12px rgba(255,60,150,.9)) drop-shadow(0 0 35px rgba(255,0,100,.55))
}
.name span{display:inline-block;opacity:0;transform-origin:center bottom}
.heart-container{
  position:absolute;z-index:2;width:min(65vw,430px);aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none
}
.heart{
  position:relative;width:48%;height:48%;transform:rotate(-45deg);
  border-radius:10% 0 10% 10%;
  background:linear-gradient(135deg,#ff76aa,#ff1972 45%,#ff0055);
  box-shadow:0 0 25px #ff2175,0 0 60px rgba(255,0,100,.7),0 0 120px rgba(255,0,100,.35)
}
.heart::before,.heart::after{content:"";position:absolute;width:100%;height:100%;background:inherit;border-radius:50%}
.heart::before{top:-50%;left:0}.heart::after{top:0;left:50%}
.heart-glow{
  position:absolute;width:70%;height:70%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,50,130,.25),transparent 65%);filter:blur(20px)
}
.tap-hint{
  position:absolute;bottom:8%;left:50%;transform:translateX(-50%);z-index:10;
  font-size:11px;letter-spacing:.18em;color:rgba(255,190,215,.55);opacity:0;transition:opacity .6s ease
}
.final-message{
  position:absolute;z-index:10;left:50%;bottom:14%;width:90%;
  transform:translateX(-50%) translateY(25px);text-align:center;opacity:0;
  color:#ffdbea;font-size:clamp(15px,4vw,24px);line-height:1.7;
  text-shadow:0 0 15px rgba(255,80,150,.5)
}
.final-message strong{
  display:block;margin-top:4px;font-family:"Dancing Script",cursive;
  font-size:clamp(25px,7vw,45px);color:#ff9fc5
}
.replay{
  position:absolute;bottom:3%;left:50%;z-index:30;transform:translateX(-50%);
  padding:9px 20px;border:1px solid rgba(255,130,180,.35);border-radius:50px;
  background:rgba(255,20,100,.1);backdrop-filter:blur(10px);color:#ffdbea;
  font-family:"Poppins",sans-serif;font-size:10px;letter-spacing:.2em;
  cursor:pointer;opacity:0;pointer-events:none;transition:.35s ease
}
.replay.show{opacity:1;pointer-events:auto}
.replay:active{transform:translateX(-50%) scale(.92)}
.flash{position:absolute;inset:0;z-index:20;background:white;opacity:0;pointer-events:none}
.vignette{position:absolute;inset:0;z-index:25;pointer-events:none;box-shadow:inset 0 0 140px rgba(0,0,0,.95)}
.floating-heart{position:absolute;z-index:4;pointer-events:none;color:#ff6da5;font-size:15px;opacity:0;text-shadow:0 0 10px #ff1769}
@media(max-width:480px){.sorry{letter-spacing:.12em}.name{font-size:43px}.heart-container{width:75vw}}
</style>
</head>

<body>
<div class="scene" id="scene">
  <canvas id="particles"></canvas>
  <div class="top-text">A LITTLE MESSAGE FOR YOU</div>

  <div class="center">
    <div class="heart-container" id="heartContainer">
      <div class="heart-glow"></div>
      <div class="heart" id="heart"></div>
    </div>
    <div class="sorry" id="sorry">SORRY</div>
    <div class="name" id="name"></div>
  </div>

  <div class="final-message" id="finalMessage">
    I really, really mean it...
    <strong>Sorry Sappuuuuuuuuu ❤️</strong>
  </div>

  <div class="tap-hint" id="tapHint">TAP ANYWHERE FOR LOVE ✦</div>
  <button class="replay" id="replay">↻ PLAY AGAIN</button>
  <div class="flash" id="flash"></div>
  <div class="vignette"></div>
</div>

<script>
const nameText="Sappuuuuuuuuu";
const nameElement=document.getElementById("name");

nameText.split("").forEach((letter,index)=>{
  const span=document.createElement("span");
  span.textContent=letter;
  span.dataset.index=index;
  nameElement.appendChild(span);
});

const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");
let particles=[];

function resizeCanvas(){
  canvas.width=innerWidth*devicePixelRatio;
  canvas.height=innerHeight*devicePixelRatio;
  canvas.style.width=innerWidth+"px";
  canvas.style.height=innerHeight+"px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);

  particles=Array.from({length:120},()=>({
    x:Math.random()*innerWidth,
    y:Math.random()*innerHeight,
    radius:Math.random()*1.5+.2,
    opacity:Math.random()*.7+.1,
    speed:Math.random()*.4+.1
  }));
}
addEventListener("resize",resizeCanvas);
resizeCanvas();

function drawParticles(time){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  particles.forEach(p=>{
    const twinkle=.5+.5*Math.sin(time*.001*p.speed*8);
    ctx.globalAlpha=p.opacity*twinkle;
    ctx.fillStyle="#fff";
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
    ctx.fill();
  });
  requestAnimationFrame(drawParticles);
}
requestAnimationFrame(drawParticles);

const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));

function animate(element,keyframes,options){
  return element.animate(keyframes,options).finished.catch(()=>{});
}

function createFloatingHeart(x,y){
  const heart=document.createElement("div");
  heart.className="floating-heart";
  heart.textContent=Math.random()>.5?"♥":"♡";
  heart.style.left=x+"px";
  heart.style.top=y+"px";
  document.getElementById("scene").appendChild(heart);

  const size=12+Math.random()*18;
  heart.style.fontSize=size+"px";

  const drift=(Math.random()-.5)*120;

  animate(heart,[
    {opacity:0,transform:"translate(-50%,0) scale(.2)"},
    {opacity:.9,transform:"translate(-50%,-50px) scale(1)",offset:.25},
    {opacity:0,transform:`translate(calc(-50% + ${drift}px),-${180+Math.random()*100}px) scale(.5)`}
  ],{duration:1800+Math.random()*1000,easing:"cubic-bezier(.15,.7,.25,1)"})
  .then(()=>heart.remove());
}

function heartExplosion(){
  const centerX=innerWidth/2;
  const centerY=innerHeight/2;

  for(let i=0;i<45;i++){
    const angle=Math.random()*Math.PI*2;
    const distance=100+Math.random()*Math.min(innerWidth,innerHeight)*.45;
    const heart=document.createElement("div");

    heart.className="floating-heart";
    heart.textContent=["♥","♡","✦","✧"][i%4];
    heart.style.left=centerX+"px";
    heart.style.top=centerY+"px";
    document.getElementById("scene").appendChild(heart);

    const x=Math.cos(angle)*distance;
    const y=Math.sin(angle)*distance;

    animate(heart,[
      {opacity:0,transform:"translate(-50%,-50%) scale(.1)"},
      {opacity:1,transform:"translate(-50%,-50%) scale(1.2)",offset:.12},
      {opacity:0,transform:`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(.2) rotate(${Math.random()*300}deg)`}
    ],{duration:1200+Math.random()*900,delay:Math.random()*200,easing:"cubic-bezier(.1,.75,.2,1)"})
    .then(()=>heart.remove());
  }
}

async function playAnimation(){
  const sorry=document.getElementById("sorry");
  const heartContainer=document.getElementById("heartContainer");
  const heart=document.getElementById("heart");
  const finalMessage=document.getElementById("finalMessage");
  const replay=document.getElementById("replay");
  const flash=document.getElementById("flash");
  const tapHint=document.getElementById("tapHint");
  const letters=[...document.querySelectorAll(".name span")];

  sorry.style.opacity=0;
  heartContainer.style.opacity=0;
  finalMessage.style.opacity=0;
  replay.classList.remove("show");
  tapHint.style.opacity=0;

  letters.forEach(letter=>{
    letter.style.opacity=0;
    letter.style.transform="translate(0,0) scale(.2)";
  });

  await wait(800);

  await animate(sorry,[
    {opacity:0,transform:"translateY(80px) scale(.35) rotateX(80deg)",filter:"blur(18px)"},
    {opacity:1,transform:"translateY(-8px) scale(1.15) rotateX(0)",filter:"blur(0)",offset:.72},
    {opacity:1,transform:"translateY(0) scale(1)"}
  ],{duration:1300,easing:"cubic-bezier(.12,1.3,.25,1)"});

  await wait(200);

  await Promise.all(letters.map((letter,index)=>{
    const angle=Math.random()*Math.PI*2;
    const distance=220+Math.random()*180;
    const x=Math.cos(angle)*distance;
    const y=Math.sin(angle)*distance;

    return animate(letter,[
      {opacity:0,transform:`translate(${x}px,${y}px) rotate(${(Math.random()-.5)*100}deg) scale(.1)`,filter:"blur(12px)"},
      {opacity:1,transform:"translate(0,0) rotate(0) scale(1.18)",filter:"blur(0)",offset:.72},
      {opacity:1,transform:"translate(0,0) rotate(0) scale(1)"}
    ],{
      duration:700+index*55,
      delay:index*45,
      easing:"cubic-bezier(.1,1.25,.25,1)"
    });
  }));

  await wait(100);

  await animate(letters.slice(4),[
    {transform:"scaleX(1)"},
    {transform:"scaleX(1.65)",offset:.5},
    {transform:"scaleX(1.08)"}
  ],{duration:900,easing:"cubic-bezier(.15,1.4,.3,1)"});

  heartContainer.style.opacity=1;

  await animate(heartContainer,[
    {opacity:0,transform:"scale(.05) rotate(-25deg)"},
    {opacity:1,transform:"scale(1.25) rotate(5deg)",offset:.6},
    {opacity:1,transform:"scale(1) rotate(0)"}
  ],{duration:1200,easing:"cubic-bezier(.1,1.25,.25,1)"});

  for(let beat=0;beat<4;beat++){
    await animate(heart,[
      {transform:"rotate(-45deg) scale(1)"},
      {transform:"rotate(-45deg) scale(1.22)"},
      {transform:"rotate(-45deg) scale(1)"}
    ],{duration:beat===0?700:480,easing:"ease-in-out"});
  }

  heartExplosion();

  await animate(flash,[
    {opacity:0},
    {opacity:.55,offset:.15},
    {opacity:0}
  ],{duration:450});

  await animate(finalMessage,[
    {opacity:0,transform:"translate(-50%,30px) scale(.8)",filter:"blur(12px)"},
    {opacity:1,transform:"translate(-50%,0) scale(1)",filter:"blur(0)"}
  ],{duration:1000,easing:"cubic-bezier(.15,1,.3,1)"});

  tapHint.style.opacity=1;
  replay.classList.add("show");

  for(let i=0;i<18;i++){
    setTimeout(()=>{
      createFloatingHeart(Math.random()*innerWidth,innerHeight+30);
    },i*500);
  }
}

let interactionCooldown=false;

function interact(x,y){
  if(interactionCooldown)return;
  interactionCooldown=true;

  for(let i=0;i<12;i++){
    const angle=Math.random()*Math.PI*2;
    const distance=40+Math.random()*120;
    const heart=document.createElement("div");

    heart.className="floating-heart";
    heart.textContent="♥";
    heart.style.left=x+"px";
    heart.style.top=y+"px";

    document.getElementById("scene").appendChild(heart);

    animate(heart,[
      {opacity:0,transform:"translate(-50%,-50%) scale(.2)"},
      {opacity:1,transform:"translate(-50%,-50%) scale(1.2)"},
      {opacity:0,transform:`translate(calc(-50% + ${Math.cos(angle)*distance}px),calc(-50% + ${Math.sin(angle)*distance}px)) scale(.2)`}
    ],{duration:900,easing:"cubic-bezier(.1,.75,.2,1)"})
    .then(()=>heart.remove());
  }

  setTimeout(()=>interactionCooldown=false,500);
}

document.getElementById("scene").addEventListener("click",event=>{
  if(event.target.id==="replay")return;
  interact(event.clientX,event.clientY);
});

document.getElementById("scene").addEventListener("touchstart",event=>{
  const touch=event.touches[0];
  interact(touch.clientX,touch.clientY);
},{passive:true});

document.getElementById("replay").addEventListener("click",event=>{
  event.stopPropagation();
  playAnimation();
});

playAnimation();
</script>
</body>
</html>
